<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 1000" width="3000" height="1000" role="img" aria-label="Chama Nostr banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.46" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="0.42" cy="0.48" r="0.7">
      <stop offset="0" stop-color="#FFB340" stop-opacity="0.28"/>
      <stop offset="0.34" stop-color="#F7931A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orangeRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7931A" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#F7931A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFB340" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tealRibbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#078C8C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2EE6D6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#12C7B7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="purpleRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A3CD0" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#BF5AF2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7A3CD0" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="logoLift" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="30" stdDeviation="36" flood-color="#000000" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#FFB340" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="3000" height="1000" fill="url(#bg)"/>
  <rect width="3000" height="1000" fill="url(#coreGlow)"/>

  <g opacity="0.48" filter="url(#softBlur)">
    <path d="M-180 810 C520 170 1170 170 1870 810 S2730 980 3240 310" fill="none" stroke="url(#orangeRibbon)" stroke-width="170" stroke-linecap="round"/>
    <path d="M-110 300 C620 930 1260 920 1970 320 S2730 40 3200 700" fill="none" stroke="url(#tealRibbon)" stroke-width="155" stroke-linecap="round"/>
    <path d="M-180 590 C520 1040 1280 40 1990 510 S2760 760 3220 130" fill="none" stroke="url(#purpleRibbon)" stroke-width="145" stroke-linecap="round"/>
  </g>

  <g opacity="0.16">
    <path d="M88 836 C580 640 905 292 1420 320 C1875 344 2240 566 2860 250" fill="none" stroke="#F7931A" stroke-width="2"/>
    <path d="M120 210 C660 430 1060 712 1560 660 C2070 607 2360 290 2888 382" fill="none" stroke="#2EE6D6" stroke-width="2"/>
    <path d="M180 528 C638 214 1196 220 1620 502 C2010 762 2460 800 2860 584" fill="none" stroke="#BF5AF2" stroke-width="2"/>
  </g>

  <g opacity="0.38">
    <circle cx="1005" cy="284" r="5" fill="#2EE6D6"/>
    <circle cx="1450" cy="322" r="5" fill="#F7931A"/>
    <circle cx="1920" cy="546" r="5" fill="#BF5AF2"/>
    <circle cx="2310" cy="336" r="4" fill="#2EE6D6"/>
    <circle cx="2652" cy="594" r="4" fill="#F7931A"/>
  </g>

  <image href="chama-woven-trust-mark-transparent-1024.png" x="220" y="132" width="720" height="720" preserveAspectRatio="xMidYMid meet" opacity="0.98" filter="url(#logoLift)"/>

  <g transform="translate(1030 300)">
    <text x="0" y="0" font-family="Sora, Manrope, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="178" font-weight="760" letter-spacing="0" fill="#F5F5F7">Chama</text>
    <text x="14" y="112" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="560" letter-spacing="1.2" fill="#CFCFD4">coordinator, not a wallet</text>

    <g transform="translate(18 182)">
      <rect x="0" y="-1" width="520" height="1.5" fill="#FFFFFF" opacity="0.10"/>
      <circle cx="0" cy="0" r="8" fill="#F7931A"/>
      <circle cx="168" cy="0" r="8" fill="#BF5AF2"/>
      <circle cx="422" cy="0" r="8" fill="#2EE6D6"/>
    </g>

    <text x="16" y="272" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="520" letter-spacing="5" fill="#86868B">COMMUNITY / TRUST / REPUTATION</text>
  </g>

  <g transform="translate(1038 826)" opacity="0.62">
    <text x="0" y="0" font-family="SF Mono, SFMono-Regular, JetBrains Mono, Menlo, monospace" font-size="26" letter-spacing="1.2" fill="#86868B">Nostr-native escrow. Non-custodial. No server.</text>
  </g>
</svg>
