name: Desktop release

# #57 — Desktop builds for the Tauri shell (macOS + Linux).
#
# Trigger: pushing a release tag (the `scripts/release.sh` lane tags vX.Y.Z),
# or manually via workflow_dispatch for a smoke build (no release upload).
#
# Versioning: src-tauri/tauri.conf.json points its `version` at
# ../package.json, so the bundle version always equals the npm version that
# release.sh bumped — drift is structurally impossible. The gates job still
# asserts the tag matches package.json so a hand-rolled tag can't ship a
# mislabeled binary.
#
# SECURITY: same posture as ci.yml — third-party actions are avoided
# entirely; the only actions used are the same SHA-pinned checkout and
# setup-node that ci.yml already trusts. Rust comes from the runner's
# rustup, releases are managed with the preinstalled `gh` CLI.
#
# Windows is deliberately absent for now: the fedimint-bridge sidecar build
# script is bash and the bundle is unsigned; add a windows-latest matrix leg
# (git-bash runs the script) + signing once those are sorted.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Gates (typecheck + tests + version guard)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Version guard (tag == package.json == tauri.conf source)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          CONF="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$TAG package.json=$PKG tauri.conf.version=$CONF"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          if [ "$CONF" != "../package.json" ]; then
            echo "::error::tauri.conf.json version must point at ../package.json (got: $CONF)"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build (${{ matrix.label }})
    needs: gates
    defaults:
      run:
        # bash exists on all three runner OSes (git-bash on Windows) and the
        # sidecar script + upload globs are written for it.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            bundles: dmg
            upload_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            label: Linux (x86_64)
            bundles: deb,appimage
            upload_glob: src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage
          # Windows leg validated end-to-end by the windows-bridge-probe run
          # (docs/WINDOWS-DESKTOP-BUILD.md): bridge compiles on stock MSVC
          # runners, sidecar spawns, NSIS bundles. MSI/WiX not yet validated —
          # NSIS only until it is.
          - os: windows-latest
            label: Windows (x86_64, NSIS)
            bundles: nsis
            upload_glob: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm

      # rocksdb + aws-lc are slow cold compiles (Windows ~25 min uncached).
      # SHA pin field-verified green by the windows-bridge-probe run.
      - name: Cache cargo + build targets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/fedimint-bridge/target
            src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('native/fedimint-bridge/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-${{ runner.os }}-

      - name: Linux system deps (WebKitGTK + bundler tooling)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Tauri runs beforeBuildCommand through cmd.exe on Windows, which can't
      # execute the .sh sidecar script. Route npm run-scripts through git-bash
      # (workaround proven by the windows-bridge-probe).
      - name: Route npm run-scripts through git-bash (Windows)
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

      - name: Rust toolchain (runner rustup, no third-party action)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install dependencies
        run: npm install

      # `tauri build` runs beforeBuildCommand (sidecar cargo build + vite
      # build) itself, then bundles with the version read from package.json.
      - name: Build Tauri bundles
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: List bundle output
        run: find src-tauri/target/release/bundle -maxdepth 2 -type f | sort

      - name: Upload to draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --verify-tag \
              --title "Chama desktop $TAG" \
              --notes "Unsigned desktop bundles for $TAG. APK + web remain the primary surfaces; see zapstore notes for the release story."
          gh release upload "$TAG" ${{ matrix.upload_glob }} --clobber
