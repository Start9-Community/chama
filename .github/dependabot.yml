version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      # Routine version bumps arrive as ONE reviewable PR instead of five.
      # A green CI run (typecheck + 2080 tests + build on every PR) is the
      # merge signal for these.
      npm-routine:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "shamir-secret-sharing" # escrow crypto core — always its own PR
          - "@fedimint/*"           # money path — review by hand, never batch
        update-types:
          - "minor"
          - "patch"
    # Majors and the excluded crypto/money deps still arrive as individual
    # PRs. Security updates stay individual too — those should be loud.
    ignore:
      # React 19 is a deliberate migration (react + react-dom + their @types
      # move together as one planned task), NOT a Dependabot auto-bump.
      # Remove this block when you choose to do the React 19 migration.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      # Actions are SHA-pinned (see ci.yml). One grouped PR per batch —
      # verify each new SHA against the action's release page before merging.
      gha-routine:
        applies-to: version-updates
        patterns:
          - "*"
